bundle:
  name: commonroad-rag

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog name
    default: commonroad
  storage_account:
    description: ADLS Gen2 storage account
    default: commonroadlake12345
  container:
    description: ADLS Gen2 container
    default: unitycatalog

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace>.azuredatabricks.net
    variables:
      catalog: commonroad_dev

  prod:
    mode: production
    workspace:
      host: https://<your-workspace>.azuredatabricks.net
    variables:
      catalog: commonroad
    run_as:
      service_principal_name: <prod-service-principal-app-id>
